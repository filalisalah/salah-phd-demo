name: CI — AURA-Grid (Streamlit Community Cloud)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 : tests (sans secrets)
  # ---------------------------------------------------------------------------
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  # ---------------------------------------------------------------------------
  # Job 2 : notification (Streamlit Community Cloud redéploie automatiquement)
  # ---------------------------------------------------------------------------
  notify:
    name: Notify (Streamlit Cloud auto-deploy)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Reminder — Streamlit Community Cloud auto-deploy
        run: |
          echo "✅ Tests OK sur la branche main."
          echo "🚀 Streamlit Community Cloud redéploie automatiquement l'app"
          echo "   depuis le dépôt GitHub (branche main, fichier app.py)."
          echo "   Aucune action de déploiement n'est nécessaire ici."
          echo "   Dashboard : https://share.streamlit.io"
