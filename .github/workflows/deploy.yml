# CI — AURA-Grid PoC (déploiement 100% gratuit sur Streamlit Community Cloud)
# =============================================================================
# IMPORTANT — Comment fonctionne le déploiement :
#   Streamlit Community Cloud (https://share.streamlit.io) NE se déploie PAS via
#   une GitHub Action. La plateforme est connectée directement au dépôt GitHub
#   (filalisalah/demo-phd-Ref-UOL08435, branche `main`) et redéploie
#   automatiquement l'application à chaque push sur cette branche.
#
#   Ce workflow ne « déploie » donc rien : il ne fait que la CI (validation),
#   c'est-à-dire exécuter la suite de tests avant/à côté du redéploiement
#   automatique déclenché par Streamlit Cloud.
#
#   Configuration côté Streamlit Cloud (une seule fois, dans l'UI) :
#     - Repository : filalisalah/demo-phd-Ref-UOL08435
#     - Branch     : main
#     - Main file  : app.py
#     - Python     : 3.11 (via runtime.txt -> python-3.11)
#
# Pipeline :
#   1. job `test`   : installe les deps de dev et lance `python -m pytest -q`
#                     (aucun secret requis).
#   2. job `notify` : (needs: test) affiche un rappel dans les logs indiquant
#                     que Streamlit Community Cloud redéploie automatiquement
#                     depuis `main`. Aucun secret requis.
#
# Aucun secret ni variable GitHub n'est nécessaire pour que ce workflow passe
# au vert.
#
# -----------------------------------------------------------------------------
# VARIANTE CLOUD RUN (DÉSACTIVÉE — conservée pour réactivation future)
# -----------------------------------------------------------------------------
# Le déploiement Cloud Run + Artifact Registry + Workload Identity Federation a
# été abandonné faute de facturation GCP active. Pour le réactiver plus tard :
