#   2. Créer/activer les APIs : run.googleapis.com, artifactregistry.googleapis.com,
#      iamcredentials.googleapis.com.
#   3. Configurer Workload Identity Federation (pool + provider) et les secrets
#      GitHub associés (GCP_PROJECT_ID, GCP_REGION, GCP_SERVICE_ACCOUNT,
#      GCP_WORKLOAD_IDENTITY_PROVIDER).
#   4. Décommenter le job `deploy-cloud-run` ci-dessous et l'adapter.
#
#   deploy-cloud-run:
#     name: Deploy (Cloud Run)
#     needs: test
#     if: github.ref == 'refs/heads/main'
#     runs-on: ubuntu-latest
